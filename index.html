<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#E8D5B5" />
  <meta name="description" content="BOOS ONE - مدیریت اطلاعات و ویس‌ها" />
  <title>BOOS ONE</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
  <!-- صفحه خوش‌آمدگویی (Splash) -->
  <div id="splash-screen">
    <div class="splash-content">
      <h1>BOOS ONE</h1>
      <p>Welcome to Management</p>
    </div>
  </div>

  <!-- صفحه اصلی -->
  <div id="home-page" class="page">
    <header class="header">
      <h1>BOOS ONE</h1>
      <p class="subtitle">مدیریت اطلاعات و ویس‌ها</p>
    </header>
    <div class="sections-grid" id="sections-grid"></div>
  </div>

  <!-- صفحه لیست افراد / یادآوری -->
  <div id="section-page" class="page">
    <header class="header">
      <button class="btn-back" onclick="goHome()">← بازگشت</button>
      <h1 id="section-title">عنوان بخش</h1>
    </header>

    <!-- مخصوص بخش‌های عادی -->
    <div id="normal-section-ui">
      <div class="toolbar">
        <button class="btn-primary" onclick="showAddPersonForm()">+ افزودن شخص جدید</button>
      </div>
      <div id="add-person-form" class="form-card hidden">
        <input type="text" id="person-name" placeholder="نام شخص / رکورد" />
        <textarea id="person-info" placeholder="اطلاعات و توضیحات..." rows="3"></textarea>
        <div class="form-actions">
          <button class="btn-primary" onclick="savePerson()">ذخیره</button>
          <button class="btn-secondary" onclick="hideAddPersonForm()">انصراف</button>
        </div>
      </div>
      <div id="persons-list" class="persons-list"></div>
    </div>

    <!-- مخصوص بخش یادآوری -->
    <div id="reminder-section-ui" class="hidden">
      <div class="toolbar">
        <button class="btn-primary" onclick="showAddReminderForm()">+ یادآوری جدید</button>
      </div>
      <div id="add-reminder-form" class="form-card hidden">
        <input type="text" id="reminder-title" placeholder="عنوان یادآوری (مثلاً قرار با فلانی)" />
        <textarea id="reminder-note" placeholder="توضیحات بیشتر..." rows="2"></textarea>
        <label class="form-label">تاریخ یادآوری:</label>
        <input type="date" id="reminder-date" />
        <div class="form-actions">
          <button class="btn-primary" onclick="saveTextReminder()">ذخیره یادآوری</button>
          <button class="btn-secondary" onclick="hideAddReminderForm()">انصراف</button>
        </div>
      </div>
      <div id="reminders-list" class="persons-list"></div>
    </div>
  </div>

  <!-- صفحه جزئیات یک شخص -->
  <div id="person-page" class="page">
    <header class="header">
      <button class="btn-back" onclick="goToSection()">← بازگشت به لیست</button>
      <h1 id="person-title">نام شخص</h1>
    </header>

    <div class="person-info-card">
      <h3>اطلاعات</h3>
      <p id="person-info-text"></p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
        <button class="btn-secondary btn-small" onclick="editPersonName()">ویرایش نام</button>
        <button class="btn-secondary btn-small" onclick="editPersonInfo()">ویرایش اطلاعات</button>
        <button class="btn-danger btn-small" onclick="deletePerson()">حذف کامل شخص</button>
      </div>
    </div>

    <div class="voices-section">
      <div class="voices-header">
        <h3>ویس‌ها</h3>
        <button class="btn-primary btn-small" onclick="startRecording()">🎤 ضبط ویس جدید</button>
      </div>
      <div id="recording-status" class="recording-status hidden">
        <span class="rec-dot"></span> در حال ضبط...
        <button class="btn-danger btn-small" onclick="stopRecording()">توقف</button>
      </div>
      <div id="voices-list" class="voices-list"></div>
    </div>
  </div>

  <!-- صفحه هوش مصنوعی -->
  <div id="ai-page" class="page">
    <header class="header">
      <button class="btn-back" onclick="goHome()">← بازگشت</button>
      <h1>هوش مصنوعی BOOS ONE</h1>
      <p class="subtitle">دستیار حقوقی و ملکی</p>
    </header>

    <div id="chat-container" style="display:flex; flex-direction:column; height:70vh; max-width:480px; margin:0 auto;">
      
      <!-- محل نمایش پیام‌ها -->
      <div id="chat-messages" style="flex:1; overflow-y:auto; padding:12px; background:#faf6ef; border-radius:14px; margin-bottom:12px;">
        <div style="text-align:center; color:#8b7355; padding:20px;">
          سلام! من دستیار BOOS ONE هستم.<br>
          می‌توانید سؤالات حقوقی، ملکی یا محاسبات زمین را بپرسید.
        </div>
      </div>

      <!-- قسمت نوشتن پیام -->
      <div style="display:flex; gap:8px;">
        <input type="text" id="chat-input" placeholder="سؤال خود را بنویسید..." 
               style="flex:1; padding:12px; border:1px solid #e0d0b0; border-radius:12px; font-size:1rem; font-family:inherit;">
        <button class="btn-primary" onclick="sendMessage()" style="padding:12px 18px;">ارسال</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
