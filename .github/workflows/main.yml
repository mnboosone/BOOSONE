name: Build BOOS ONE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap config (force non-interactive)
        run: |
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "=== Bubblewrap config created ==="
          cat $HOME/.bubblewrap/config.json
          echo "JAVA_HOME = $JAVA_HOME"
          echo "ANDROID_HOME = $ANDROID_HOME"

      - name: Create twa-manifest.json and generate project
        run: |
          mkdir -p android
          cd android

          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "com.mnboosone.boosone",
            "host": "mnboosone.github.io",
            "name": "BOOS ONE",
            "launcherName": "BOOS ONE",
            "display": "standalone",
            "themeColor": "#000000",
            "themeColorDark": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "enableNotifications": true,
            "startUrl": "/BOOSONE/",
            "iconUrl": "https://mnboosone.github.io/BOOSONE/icon-512.png",
            "maskableIconUrl": "https://mnboosone.github.io/BOOSONE/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://mnboosone.github.io/BOOSONE/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

          bubblewrap update --skipVersionUpgrade

      - name: Build APK
        working-directory: android
        run: |
          bubblewrap build --skipPwaValidation --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOS-ONE-APK
          path: |
            android/app-release-unsigned-aligned.apk
            android/app-release-unsigned.apk
            android/*.apk
          if-no-files-found: warn
